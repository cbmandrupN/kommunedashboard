name: Check geographic API response
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inspect two geographic response envelopes
        env:
          EMODATA_USERNAME: ${{ secrets.EMODATA_USERNAME }}
          EMODATA_PASSWORD: ${{ secrets.EMODATA_PASSWORD }}
        run: python scripts/market_probe.py
