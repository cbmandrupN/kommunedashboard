name: Update EMOData

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emodata-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate dashboard data
        env:
          EMODATA_USERNAME: ${{ secrets.EMODATA_USERNAME }}
          EMODATA_PASSWORD: ${{ secrets.EMODATA_PASSWORD }}
        run: |
          python scripts/pipeline.py update-emodata \
            --inventory data/municipality-inventory.json.gz \
            --dashboard src/data/dashboard-data.json | tee update-summary.json
      - name: Test generated data
        run: python -m unittest discover -s tests -v
      - name: Write job summary
        run: |
          echo "## EMOData-opdatering" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat update-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated data
        run: |
          if git diff --quiet -- src/data/dashboard-data.json; then
            echo "Data er uændret."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/dashboard-data.json
          git commit -m "Update EMOData dashboard data"
          git push
