name: EMOData market activity pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test bounded sampling
        run: python -m unittest discover -s tests -p test_market_activity_pilot.py -v
      - name: Sample two days and at most eight reports
        env:
          EMODATA_USERNAME: ${{ secrets.EMODATA_USERNAME }}
          EMODATA_PASSWORD: ${{ secrets.EMODATA_PASSWORD }}
        run: python scripts/market_activity_pilot.py --as-of 2026-10-26 --output market-pilot.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-activity-pilot
          path: market-pilot.json
          retention-days: 3
          if-no-files-found: error
