name: Update market activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1,15 * *"

permissions:
  contents: write

concurrency:
  group: market-activity-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p test_market_activity.py -v
      - name: Update nationwide activity snapshot
        env:
          EMODATA_USERNAME: ${{ secrets.EMODATA_USERNAME }}
          EMODATA_PASSWORD: ${{ secrets.EMODATA_PASSWORD }}
        run: python scripts/market_activity.py --output public/market-activity.json
      - name: Commit market data only
        run: |
          git add public/market-activity.json
          if git diff --cached --quiet; then
            echo "Markedsdata er uændret."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update nationwide market activity"
          git pull --rebase origin main
          git push origin HEAD:main
